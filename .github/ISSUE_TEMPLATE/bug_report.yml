name: Bug report
description: Something broke
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: WhisperDeck version
  - type: textarea
    id: wav
    attributes:
      label: Audio properties
      description: rate / channels / bit width of the failing file
